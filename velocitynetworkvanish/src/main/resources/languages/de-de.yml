# Nachrichten für VelocityNetworkVanish, auf Deutsch.
#
# Diese Datei wird mit "language: de-de" in der config.yml ausgewählt.

messages:
  vanish-enabled: "<green>* Du bist jetzt <gradient:green:dark_green>unsichtbar</gradient>.</green>"
  vanish-disabled: "<dark_gray>* Du bist nicht mehr <gradient:red:dark_red>unsichtbar</gradient>.</dark_gray>"

  # /silentvanish (auch /svanish, /sv) schaltet um, ohne etwas anzukündigen.
  silent-vanish-enabled: "<green>* Du bist jetzt <gradient:green:dark_green>unsichtbar</gradient>. <dark_gray>(lautlos)</dark_gray></green>"
  silent-vanish-disabled: "<dark_gray>* Du bist nicht mehr <gradient:red:dark_red>unsichtbar</gradient>. (lautlos)</dark_gray>"

  # /vanish kündigt eine vorgetäuschte Abmeldung an, das Aufheben eine vorgetäuschte Anmeldung,
  # sodass es für alle anderen wie ein normales Trennen und Wiederverbinden aussieht. Wer die
  # Berechtigung zum Sehen unsichtbarer Spieler hat, bekommt das nie zu sehen.
  #
  # Diese Zeilen müssen exakt wie broadcast.join und broadcast.leave in der Sprachdatei von
  # VelocityNetworkPlayerInfo für DIESELBE Sprache lauten, sonst sieht eine vorgetäuschte
  # Abmeldung anders aus als eine echte und verrät den Vanish. <player> ist der einzige
  # Platzhalter, "" kündigt für diese Richtung nichts an.
  fake-join: '<dark_gray>* "<player>" hat den Server betreten.</dark_gray>'
  fake-leave: '<dark_gray>* "<player>" hat den Server verlassen.</dark_gray>'

  # Statt einen unsichtbaren Spieler an einen geschützten Befehl wie /tpa zu verraten, als wäre
  # er gar nicht online. <target> ist der getippte Name.
  target-not-found: '<dark_red>* Es wurde kein Spieler mit dem Namen "<target>" gefunden.</dark_red>'
  players-only: "<dark_red>* Nur Spieler können diesen Befehl benutzen.</dark_red>"
