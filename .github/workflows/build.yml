# Builds every plugin on each push to a version branch (26.2, 26.3, ...) and publishes the jars as
# a GitHub release titled "VelocityNetworkUtilities (<branch>)", tagged by branch and build number.
#
# Pull requests and manual runs build too, and keep the jars as a downloadable artifact of the
# run, but only pushes to a version branch make a release. A change only to files that cannot
# affect the jars (docs, .gitignore, the Dependabot config) builds and releases nothing. Changes
# to this workflow still build, so a broken pipeline shows up right away.
name: Build

on:
  push:
    branches: ["26.*"]
    paths-ignore: ["**.md", ".gitignore", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", ".github/dependabot.yml"]
  workflow_dispatch:

# Only the release step needs to write, and it asks for that itself below.
permissions:
  contents: read

# Builds of the same branch queue up rather than cancel each other, so every push gets its release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle and checks that gradle-wrapper.jar is the genuine one before running it.
      - uses: gradle/actions/setup-gradle@v6

      # Most servers here run Velocity-CTD, whose API differs from Velocity's in places. Building
      # against it first fails the run if anything the plugins use is missing or changed there.
      - name: Check against the Velocity-CTD API
        run: ./gradlew clean build -Pctd --no-daemon

      # The jars that get released, built against Velocity's own API.
      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Check every plugin was built
        run: |
          count=$(find deploy -maxdepth 1 -name '*.jar' | wc -l)
          echo "Built $count jars:"
          ls -l deploy
          if [ "$count" -ne 8 ]; then
            echo "Expected 8 plugin jars in deploy/, found $count." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ github.sha }}
          path: deploy/*.jar
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Passed as data, never pasted into the script, so a commit message cannot run anything.
          COMMITS: ${{ toJSON(github.event.commits) }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="${BRANCH}-build.${RUN}"
          # The notes are the first line of every commit in the push, one per line.
          printf '%s' "$COMMITS" | jq -r '.[]?.message | split("\n")[0] | "- " + .' > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '%s\n' "- ${HEAD_MESSAGE%%$'\n'*}" > release-notes.md
          fi

          # "Latest" on GitHub is the default branch's newest build, never an older version line.
          latest="--latest=false"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            latest="--latest"
          fi

          # A re-run of the same run keeps its number, so its release already exists: replace
          # the jars in it rather than fail on the tag being taken.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" deploy/*.jar --clobber
          else
            gh release create "$tag" deploy/*.jar \
              --target "$GITHUB_SHA" \
              --title "VelocityNetworkUtilities" \
              --notes-file release-notes.md \
              "$latest"
          fi
