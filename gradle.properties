group=de.lovinoes
version=1.0.0
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Everything that changes with a Minecraft version lives here, so an update touches this file and
# nothing else. minecraftVersion is written into both paper-plugin.yml files as their api-version.
minecraftVersion=26.3
paperApiVersion=26.3.build.134-beta
velocityApiVersion=4.2.0

# Velocity-CTD's API, used instead of Velocity's when building with -Pctd. CTD's API is Velocity's
# plus extras, so the jars built either way are the same and run on both proxies; -Pctd only
# proves that everything the plugins use exists in CTD. CI builds both ways.
ctdApiVersion=4.2.1-SNAPSHOT
